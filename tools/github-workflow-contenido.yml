# Publica en la web desde un issue, para poder hacerlo desde el movil.
# La etiqueta decide la seccion: linkedin, manuscript o report.
name: Contenido de la web

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Que seccion toca
        id: cual
        env:
          ETIQUETAS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          for t in linkedin manuscript report; do
            case ",$ETIQUETAS," in *",$t,"*) echo "tipo=$t" >> "$GITHUB_OUTPUT"; exit 0;; esac
          done
          echo "tipo=" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cual.outputs.tipo != ''

      - uses: actions/setup-python@v5
        if: steps.cual.outputs.tipo != ''
        with:
          python-version: '3.12'

      - name: Volcar el cuerpo del issue
        if: steps.cual.outputs.tipo != ''
        env:
          CUERPO: ${{ github.event.issue.body }}
        run: printf '%s' "$CUERPO" > /tmp/issue.md

      - name: Anadir la entrada
        if: steps.cual.outputs.tipo != ''
        run: python tools/add_from_issue.py --tipo "${{ steps.cual.outputs.tipo }}" --body-file /tmp/issue.md | tee /tmp/salida.txt

      - name: Commit
        id: commit
        if: steps.cual.outputs.tipo != ''
        run: |
          if git diff --quiet -- data/; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Web: ${{ github.event.issue.title }}

          Desde el issue #${{ github.event.issue.number }}."
          git push
          echo "cambios=si" >> "$GITHUB_OUTPUT"

      - name: Responder al issue
        if: steps.cual.outputs.tipo != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.commit.outputs.cambios }}" = "si" ]; then
            gh issue comment ${{ github.event.issue.number }} \
              --body "Publicado en https://biopelayo.github.io/

          $(cat /tmp/salida.txt)"
            gh issue close ${{ github.event.issue.number }}
          else
            gh issue comment ${{ github.event.issue.number }} \
              --body "Sin cambios: eso ya estaba publicado."
          fi
